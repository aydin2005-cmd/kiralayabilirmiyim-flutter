name: Flutter B2B targeted hardening 2026-08-21

on:
  push:
    branches:
      - codex/b2b-consolidated-fixes-2026-08-21
    paths-ignore:
      - '.ci-results/**'
  workflow_dispatch:

permissions:
  contents: write

# Temporary release-candidate validation. Remove before merge.
jobs:
  targeted-flutter-b2b:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - id: flutter
        name: Set up Flutter stable
        continue-on-error: true
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - id: pubget
        name: Resolve dependencies
        if: steps.flutter.outcome == 'success'
        continue-on-error: true
        run: flutter pub get

      - id: targeted
        name: Run targeted B2B Flutter tests only
        if: steps.pubget.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter test \
            test/b2b_registration_test.dart \
            test/b2b_multi_org_login_test.dart \
            test/b2b_packages_payment_return_test.dart \
            test/b2b_consolidated_hardening_test.dart 2>&1 | tee /tmp/flutter-targeted.log

      - id: analyze
        name: Run Flutter analyzer
        if: steps.pubget.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee /tmp/flutter-analyze.log

      - name: Record targeted result on development branch
        if: always()
        env:
          FLUTTER_OUTCOME: ${{ steps.flutter.outcome }}
          PUBGET_OUTCOME: ${{ steps.pubget.outcome }}
          TEST_OUTCOME: ${{ steps.targeted.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TEST_SHA: ${{ github.sha }}
        run: |
          mkdir -p .ci-results
          {
            echo "sha=$TEST_SHA"
            echo "flutter_setup=$FLUTTER_OUTCOME"
            echo "pub_get=$PUBGET_OUTCOME"
            echo "targeted_tests=$TEST_OUTCOME"
            echo "analyze=$ANALYZE_OUTCOME"
            echo "suite=b2b_registration,b2b_multi_org_login,b2b_packages_payment_return,b2b_consolidated_hardening"
            echo "--- targeted_diagnostic_tail ---"
            if [ -f /tmp/flutter-targeted.log ]; then
              tail -n 100 /tmp/flutter-targeted.log
            else
              echo "targeted test log unavailable"
            fi
            echo "--- analyze_diagnostic_tail ---"
            if [ -f /tmp/flutter-analyze.log ]; then
              tail -n 100 /tmp/flutter-analyze.log
            else
              echo "analyzer log unavailable"
            fi
          } > .ci-results/flutter-b2b-targeted.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-results/flutter-b2b-targeted.txt
          git commit -m "Record targeted Flutter B2B CI result" || true
          git push

      - name: Fail if targeted validation failed
        if: always()
        env:
          FLUTTER_OUTCOME: ${{ steps.flutter.outcome }}
          PUBGET_OUTCOME: ${{ steps.pubget.outcome }}
          TEST_OUTCOME: ${{ steps.targeted.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          test "$FLUTTER_OUTCOME" = "success"
          test "$PUBGET_OUTCOME" = "success"
          test "$TEST_OUTCOME" = "success"
          test "$ANALYZE_OUTCOME" = "success"
